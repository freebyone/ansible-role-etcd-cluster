flush_all: false
delete_keys_storage: false

# TLS configuration
etcd_enable_tls: false
etcd_certs_dir: "/etc/etcd/ssl"
etcd_ca_cert: "{{ etcd_certs_dir }}/ca.pem"
etcd_server_cert: "{{ etcd_certs_dir }}/server.pem"
etcd_server_key: "{{ etcd_certs_dir }}/server-key.pem"
etcd_client_cert: "{{ etcd_certs_dir }}/client.pem"
etcd_client_key: "{{ etcd_certs_dir }}/client-key.pem"

etcd_user: "root"
etcd_group: "root"
etcd_client_host: "localhost"

etcd_version: "3.5.13"
etcd_docker_image: "quay.io/coreos/etcd:v{{ etcd_version }}"

etcd_data_dir: "/var/lib/etcd"
etcd_cluster_token: "etcd-cluster-1"
etcd_cluster: etcd-cluster
etcd_service: "{{ etcd_cluster }}.service"

etcd_user_shell: "/bin/false"
etcd_user_system: true
etcd_group_system: true
etcd_user_home: "/var/lib/etcd"

etcd_client_port: 2379
etcd_peer_port: 2380

# Use DNS
etcd_initial_cluster: "{% for host in groups['etcd_cluster'] %}{{ hostvars[host].etcd_node_name | default(host) }}=http{% if etcd_enable_tls %}s{% endif %}://{{ host }}:{{ etcd_peer_port }}{% if not loop.last %},{% endif %}{% endfor %}"
etcd_node_name: "{{ inventory_hostname }}"

# Auto-compaction
etcd_auto_compaction_mode: "periodic"
etcd_auto_compaction_retention: "1"

# Dynamic command TLS
etcdctl_base_command: "docker exec {{ etcd_cluster }} /usr/local/bin/etcdctl"
etcdctl_endpoints: "{% if etcd_enable_tls %}https{% else %}http{% endif %}://{{ etcd_client_host }}:{{ etcd_client_port }}"
etcdctl_tls_args: "{% if etcd_enable_tls %}--cacert={{ etcd_ca_cert }} --cert={{ etcd_client_cert }} --key={{ etcd_client_key }}{% endif %}"

# Control commands
etcdctl_full_command: "{{ etcdctl_base_command }} --endpoints={{ etcdctl_endpoints }} {{ etcdctl_tls_args }}"
etcdctl_delete_all_keys: "{{ etcdctl_full_command }} del '' --prefix"
etcdctl_list_keys: "{{ etcdctl_full_command }} get '' --prefix --keys-only"
etcdctl_count_keys: "{{ etcdctl_list_keys }} | wc -l"
etcdctl_check_health: "{{ etcdctl_full_command }} endpoint health"