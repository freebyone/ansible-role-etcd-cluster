flush_all: false
delete_keys_storage: false

etcd_user: "root"
etcd_group: "root"
etcd_client_host: "localhost"

etcd_version: "3.5.13"
etcd_docker_image: "quay.io/coreos/etcd:v{{ etcd_version }}"

etcd_data_dir: "/var/lib/etcd"
etcd_cluster_token: "etcd-cluster-1"
etcd_cluster: etcd-cluster
etcd_service: "{{ etcd_cluster }}.service"

etcd_user_shell: "/bin/false"
etcd_user_system: true
etcd_group_system: true
etcd_user_home: "/var/lib/etcd"

etcd_client_port: 2379
etcd_peer_port: 2380

# Use DNS
etcd_initial_cluster: "{% for host in groups['etcd_cluster'] %}{{ hostvars[host].etcd_node_name | default(host) }}=http://{{ host }}:2380{% if not loop.last %},{% endif %}{% endfor %}"
etcd_node_name: "{{ inventory_hostname }}"

# Command for control etcd keys
etcdctl_base_command: "docker exec {{ etcd_cluster }} /usr/local/bin/etcdctl --endpoints=http://{{ etcd_client_host }}:{{ etcd_client_port }}"

etcdctl_delete_all_keys: "{{ etcdctl_base_command }} del '' --prefix"
etcdctl_list_keys: "{{ etcdctl_base_command }} get '' --prefix --keys-only"
etcdctl_count_keys: "{{ etcdctl_list_keys }} | wc -l"
etcdctl_check_health: "{{ etcdctl_base_command }} endpoint health"