---
- name: Include certificates setup
  ansible.builtin.include_tasks: certificates.yml
  when: etcd_enable_tls

- name: Create group
  group:
    name: "{{ etcd_group }}"
    state: present
    system: "{{ etcd_group_system | bool }}"
    gid: "{{ etcd_group_gid | default(omit) }}"
  when:
    - etcd_group != "root"

- name: Create user
  user:
    name: "{{ etcd_user }}"
    state: present
    shell: "{{ etcd_user_shell }}"
    system: "{{ etcd_user_system | bool }}"
    create_home: "{{ etcd_user_home is defined and etcd_user_system != true | bool }}"
    home: "{{ etcd_user_home | default(omit) }}"
    uid: "{{ etcd_user_uid | default(omit) }}"
    group: "{{ etcd_group }}"
  when:
    - etcd_user != "root"

- name: Create etcd data directory
  file:
    path: "{{ etcd_data_dir }}"
    state: directory
    owner: "{{ etcd_user }}"
    group: "{{ etcd_group }}"
    mode: '0755'

- name: Pull etcd Docker image
  docker_image:
    name: "{{ etcd_docker_image }}"
    source: pull

- name: Create etcd systemd service
  template:
    src: etcd.service.j2
    dest: "/etc/systemd/system/{{ etcd_cluster }}.service"
    owner: "{{ etcd_user }}"
    group: "{{ etcd_group }}"
    mode: '0644'

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes

- name: Start and enable etcd service
  systemd:
    name: "{{ etcd_cluster }}"
    state: started
    enabled: yes

- name: Check Docker container status
  shell: docker ps -a | grep {{ etcd_cluster }} || true
  register: container_status
  failed_when: false

- name: Debug container status
  debug:
    var: container_status.stdout

- name: Check etcd container logs
  shell: docker logs {{ etcd_cluster }} 2>&1 | tail -20
  register: etcd_logs
  failed_when: false

- name: Debug etcd logs
  debug:
    var: etcd_logs.stdout

- name: Wait for etcd to start
  wait_for:
    port: "{{ etcd_client_port }}"
    host: "0.0.0.0"
    delay: 5
    timeout: 30

- name: Check etcd cluster health
  shell: "{{ etcdctl_check_health }}"
  environment:
    ETCDCTL_API: "3"
  register: etcd_health
  until: etcd_health.rc == 0
  retries: 15
  delay: 5
  ignore_errors: true

- name: Show etcd health status
  debug:
    msg: "{{ etcd_health.stdout }}"